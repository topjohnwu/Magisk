cargo-features = ["panic-immediate-abort"]

[workspace]
exclude = ["external"]
members = ["base", "base/derive", "boot", "core", "init", "sepolicy"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
base = { path = "base" }
derive = { path = "base/derive" }
magiskpolicy = { path = "sepolicy" }
cxx = { path = "external/cxx-rs" }
cxx-gen = { path = "external/cxx-rs/gen/lib" }
libc = "0.2.189"
cfg-if = "1.0.4"
num-traits = "0.2.19"
num-derive = "0.5.1"
thiserror = "2.0.19"
byteorder = "1.5.0"
size = "0.5.0"
bytemuck = "1.25.2"
fdt = "0.1.5"
const_format = "0.2.36"
bit-set = "0.11.1"
syn = "3.0.3"
quote = "1.0.47"
proc-macro2 = "1.0.107"
pb-rs = { version = "0.10.0", default-features = false }
quick-protobuf = "0.8.1"
flate2 = { version = "1.1.9", default-features = false }
bzip2 = "0.6.1"
zopfli = { version = "0.8.3", default-features = false}
lz4 = "1.28.1"
lzma-rust2 = { version = "0.18.0", default-features = false }
nix = "0.31.3"
bitflags = "2.13.1"

# Rust crypto crates are tied together
sha1 = "0.11.0"
sha2 = "0.11.0"
digest = "0.11.3"
p256 = "0.14.0"
p384 = "0.14.0"
p521 = "0.14.0"
rsa = "0.10.0-rc.18"
x509-cert = "0.3.0"
der = "0.8.1"

[patch.crates-io]
pb-rs = { git = "https://github.com/topjohnwu/quick-protobuf.git" }
quick-protobuf = { git = "https://github.com/topjohnwu/quick-protobuf.git" }
lz4-sys = { path = "external/lz4-sys" }

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.dev]
opt-level = "z"
lto = "thin"
panic = "immediate-abort"
debug = "none"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
strip = true
